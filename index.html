<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Kiosk Printer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lime: '#C6F255',
                        jet: '#000000',
                    },
                    borderRadius: {
                        '2xl': '16px',
                    },
                    boxShadow: {
                        'brutal': '6px 6px 0px 0px rgba(0,0,0,1)',
                    }
                }
            }
        }
    </script>
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Input styling */
        select, input[type="file"] {
            appearance: none;
        }

        /* 
         * CRITICAL PRINT CSS
         * Forces exactly A4, flex-row centering, 2x3 inches, and object-fit: cover 
         */
        #print-area { display: none; }
        @media print {
            @page { size: A4 portrait; margin: 0; }
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                display: flex !important;
                flex-direction: row !important;
                justify-content: center !important;
                align-items: flex-start !important;
                gap: 1mm !important;
                position: absolute;
                left: 0; top: 0;
                width: 210mm !important;
                padding-top: 15mm !important;
                box-sizing: border-box;
            }
            .print-photo {
                width: 2in !important; 
                height: 3in !important;
                object-fit: cover !important;
                box-sizing: border-box !important;
                border: 1px dashed #999 !important;
            }
            .filter-bw { filter: grayscale(100%) !important; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- DESKTOP UI -->
    <div id="desktop-ui" class="w-full max-w-lg hidden flex-col items-center">
        
        <div class="w-full bg-white border-2 border-jet rounded-2xl shadow-brutal p-8">
            <h1 class="text-3xl font-black mb-2 uppercase tracking-tight">Kiosk Setup</h1>
            <p class="text-jet/70 font-medium mb-6">Configure settings & connect mobile device.</p>
            
            <div id="setup-controls" class="space-y-5">
                <div>
                    <label class="block font-bold text-sm mb-1 uppercase tracking-wide">Print Format</label>
                    <div class="p-3 border-2 border-jet rounded-xl bg-gray-50 text-sm font-semibold opacity-70">
                        A4 Paper • 2" x 3" Photos • 4 per row
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-sm mb-1 uppercase tracking-wide">Quality & Color</label>
                    <div class="relative">
                        <select id="print-mode" class="w-full p-3 border-2 border-jet rounded-xl bg-white font-semibold cursor-pointer focus:outline-none focus:ring-2 focus:ring-lime">
                            <option value="color-std">Standard Printing - Color</option>
                            <option value="bw-std">Standard Printing - B&W</option>
                            <option value="color-high">High Quality - Color</option>
                            <option value="bw-high">High Quality - B&W</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-jet">
                            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
                        </div>
                    </div>
                </div>

                <button id="btn-generate" class="w-full bg-lime text-jet border-2 border-jet rounded-xl font-black uppercase tracking-wide py-4 mt-4 hover:bg-jet hover:text-lime transition-colors">
                    Generate QR Code
                </button>
            </div>

            <!-- QR Code Area -->
            <div id="qr-section" class="hidden flex-col items-center mt-4">
                <div class="border-4 border-jet p-2 rounded-2xl bg-white mb-4">
                    <div id="qrcode"></div>
                </div>
                <p id="status-text" class="font-bold text-center animate-pulse">Waiting for network...</p>
                <button id="btn-cancel" class="mt-4 text-sm font-bold underline hover:text-gray-500">Cancel</button>
            </div>
        </div>
    </div>

    <!-- MOBILE UI -->
    <div id="mobile-ui" class="w-full max-w-sm hidden flex-col items-center">
        <div class="w-full bg-white border-2 border-jet rounded-2xl shadow-brutal p-8 text-center">
            <h2 class="text-2xl font-black mb-2 uppercase tracking-tight">Send Photo</h2>
            <p id="mobile-status" class="text-jet/70 font-medium mb-6">Connecting to kiosk...</p>
            
            <div id="upload-section" class="hidden space-y-4">
                <label class="block w-full cursor-pointer bg-white border-2 border-dashed border-jet rounded-xl p-8 hover:bg-gray-50 transition-colors">
                    <input type="file" id="file-input" accept="image/*" class="hidden">
                    <div class="flex flex-col items-center">
                        <svg class="w-10 h-10 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span class="font-bold">Tap to select photo</span>
                    </div>
                </label>

                <button id="btn-send" disabled class="w-full bg-jet text-white border-2 border-jet rounded-xl font-black uppercase tracking-wide py-4 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-lime hover:text-jet transition-colors">
                    Send to Printer
                </button>
            </div>

            <div id="success-section" class="hidden py-4">
                <div class="w-16 h-16 bg-lime border-2 border-jet rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-jet" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h3 class="font-black text-xl mb-1">Photo Sent!</h3>
                <p class="text-sm font-medium">Check the kiosk screen.</p>
                <button onclick="window.location.reload()" class="mt-6 font-bold underline text-sm">Send another</button>
            </div>
        </div>
    </div>

    <!-- PRINT AREA -->
    <div id="print-area">
        <img class="print-photo" alt="Photo 1">
        <img class="print-photo" alt="Photo 2">
        <img class="print-photo" alt="Photo 3">
        <img class="print-photo" alt="Photo 4">
    </div>

    <script>
        let peer = null;
        let connection = null;
        let selectedFileDataUrl = null;

        // UI Elements
        const desktopUi = document.getElementById('desktop-ui');
        const mobileUi = document.getElementById('mobile-ui');
        
        // Desktop Elements
        const setupControls = document.getElementById('setup-controls');
        const qrSection = document.getElementById('qr-section');
        const btnGenerate = document.getElementById('btn-generate');
        const btnCancel = document.getElementById('btn-cancel');
        const statusText = document.getElementById('status-text');
        const printModeSelect = document.getElementById('print-mode');
        
        // Mobile Elements
        const uploadSection = document.getElementById('upload-section');
        const successSection = document.getElementById('success-section');
        const mobileStatus = document.getElementById('mobile-status');
        const fileInput = document.getElementById('file-input');
        const btnSend = document.getElementById('btn-send');

        // Print Elements
        const printArea = document.getElementById('print-area');
        const printPhotos = document.querySelectorAll('.print-photo');

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const isMobile = urlParams.get('mobile') === 'true';
            const peerId = urlParams.get('id');

            if (isMobile && peerId) {
                // Initialize Mobile Mode
                mobileUi.classList.remove('hidden');
                mobileUi.classList.add('flex');
                setupMobile(peerId);
            } else {
                // Initialize Desktop Mode
                desktopUi.classList.remove('hidden');
                desktopUi.classList.add('flex');
                setupDesktop();
            }
        }

        // --- DESKTOP LOGIC ---
        function setupDesktop() {
            btnGenerate.addEventListener('click', () => {
                const mode = printModeSelect.value;
                setupControls.classList.add('hidden');
                qrSection.classList.remove('hidden');
                qrSection.classList.add('flex');
                statusText.textContent = "Initializing network...";

                peer = new Peer();

                peer.on('open', (id) => {
                    const baseUrl = window.location.href.split('?')[0];
                    const mobileUrl = `${baseUrl}?mobile=true&id=${id}&mode=${mode}`;
                    
                    document.getElementById('qrcode').innerHTML = '';
                    new QRCode(document.getElementById("qrcode"), {
                        text: mobileUrl,
                        width: 220,
                        height: 220,
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });

                    statusText.textContent = "Scan to upload photo";
                });

                peer.on('connection', (conn) => {
                    statusText.textContent = "Device connected! Waiting for photo...";
                    
                    conn.on('data', (data) => {
                        if (data && data.image) {
                            statusText.textContent = "Processing image...";
                            processPrintData(data.image, mode);
                        }
                    });
                });

                peer.on('error', (err) => {
                    alert('Network error. Please try again.');
                    resetDesktop();
                });
            });

            btnCancel.addEventListener('click', resetDesktop);
        }

        function resetDesktop() {
            if (peer) {
                peer.destroy();
                peer = null;
            }
            qrSection.classList.add('hidden');
            qrSection.classList.remove('flex');
            setupControls.classList.remove('hidden');
        }

        function processPrintData(dataUrl, mode) {
            // Apply BW filter if selected mode implies it
            if (mode.includes('bw')) {
                printArea.classList.add('filter-bw');
            } else {
                printArea.classList.remove('filter-bw');
            }

            // Load images
            let loadedCount = 0;
            printPhotos.forEach(img => {
                img.onload = () => {
                    loadedCount++;
                    if (loadedCount === printPhotos.length) {
                        // All images loaded, trigger print
                        setTimeout(() => {
                            window.print();
                            // Clear images after a delay to save memory
                            setTimeout(() => {
                                printPhotos.forEach(p => p.src = '');
                            }, 1000);
                        }, 500);
                    }
                };
                img.src = dataUrl;
            });
        }

        // --- MOBILE LOGIC ---
        function setupMobile(targetId) {
            peer = new Peer();

            peer.on('open', () => {
                connection = peer.connect(targetId);
                
                connection.on('open', () => {
                    mobileStatus.textContent = "Connected securely.";
                    mobileStatus.classList.add('hidden');
                    uploadSection.classList.remove('hidden');
                });

                connection.on('error', () => {
                    mobileStatus.textContent = "Connection failed. Please scan again.";
                });
            });

            peer.on('error', (err) => {
                mobileStatus.textContent = "Network error. Please try again.";
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    btnSend.disabled = false;
                    btnSend.textContent = "Send to Printer";
                    btnSend.classList.add('bg-lime', 'text-jet');
                    btnSend.classList.remove('bg-jet', 'text-white');
                    
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        selectedFileDataUrl = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            btnSend.addEventListener('click', () => {
                if (!selectedFileDataUrl || !connection || !connection.open) return;
                
                btnSend.disabled = true;
                btnSend.textContent = "Sending...";
                
                connection.send({ image: selectedFileDataUrl });
                
                setTimeout(() => {
                    uploadSection.classList.add('hidden');
                    successSection.classList.remove('hidden');
                }, 500);
            });
        }

        // Run application
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
